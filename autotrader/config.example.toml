# 복사해서 config.toml로 쓰세요. config.toml은 git에 올라가지 않습니다.
# API 키는 여기 쓰지 말고 환경변수로 넣습니다 (.env.example 참고).

[trading]
mode = "paper"            # "paper"(가상 체결) | "live"(실전, 실행 시 --live 플래그도 필요)
market = "KR"             # "KR" | "US"
symbols = ["005930"]      # 종목 코드 형식은 토스 공식 문서 확인 필요
interval_sec = 300        # 루프 간격(초)

[strategy]
name = "ma_cross"
params = { short = 5, long = 20 }

[risk]
max_order_value = 500000      # 1회 매수 최대 금액
max_positions = 3
max_buys_per_day = 5
daily_loss_limit_pct = 0.03

[costs]                        # 예시값. 실제 수수료/세율로 바꾸세요.
fee_rate = 0.00015
sell_tax_rate = 0.0018
slippage_rate = 0.0005

[paper]
initial_cash = 10000000

[paths]
kill_switch = "STOP"           # 이 파일을 만들면 즉시 주문 중단 (touch STOP)
journal = "logs/journal.jsonl"

[toss]
account_id = ""
# base_url = "https://openapi.tossinvest.com"   # 공식 문서 확인 필요
